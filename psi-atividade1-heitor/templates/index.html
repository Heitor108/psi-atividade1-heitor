
{% extends "base.html" %}
{% block title %}Index{% endblock %}
{% block content %}
    <h1>Página Index</h1>
    <ul>
        {% for livro in livros %}
            <p>Título: {{livro.titulo}}</p>
            <p>Autor: {{livro.autor}}</p>
            <p>Ano: {{livro.ano}}</p>
            <a href="{{ url_for('livro', livro_id=livro.id) }}">Link do livro</a>
        {% endfor %}
    </ul>
{% endblock %}
